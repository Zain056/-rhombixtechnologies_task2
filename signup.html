<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Sign Up - Futurify</title>
<link rel="stylesheet" href="style.css"/></head>
<body class="auth">
  <div class="auth-box">
    <h2>Sign Up</h2>
    <input type="text" placeholder="Username" id="signupUser"/>
    <input type="email" placeholder="Email" id="signupEmail"/>
    <input type="password" placeholder="Password" id="signupPassword"/>
    <button onclick="alert('Sign-up not implemented')" class="btn">Sign Up</button>
    <p>Already have an account? <a href="login.html" class="btn">Login</a></p>
  </div>
</body>
</html>
